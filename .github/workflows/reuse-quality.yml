name: Quality checks

on:
  workflow_call:
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout git repository
      uses: actions/checkout@v7

    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Lint
      run: npm run lint

    - name: Build types
      run: npm run build-types

    # their compiled .js is gitignored, and specs import them by package name: lib-vue/lib-vuetify for
    # the chat composables, lib-sim for the simulation cases. lib-vue first, lib-vuetify builds on it.
    - name: Build workspace packages
      run: npm -w lib-vue run build && npm -w lib-vuetify run build && npm -w lib-sim run build

    - name: Build UI
      run: npm -w ui run build

    - name: Type check
      run: npm -w ui run check-types

    - name: Init env
      run: bash dev/init-env.sh

    - name: Start dev dependencies
      run: docker compose up -d --wait

    # npx resolves the project's own dotenv bin, node_modules/.bin is not on the runner's PATH
    - name: Start dev API
      run: npx dotenv run -- npm run dev-api &

    # fail here, with the api's own output, rather than later in the tests' state setup
    - name: Wait for dev API
      run: |
        port=$(grep '^DEV_API_PORT=' .env | cut -d= -f2)
        for i in $(seq 60); do
          curl -sf "http://localhost:$port/api/ping" > /dev/null && exit 0
          sleep 1
        done
        echo "dev API did not answer on port $port"
        cat dev/logs/dev-api.log || true
        exit 1

    # data-fair's stand-in: privateMcpUrl (api/config/development.js) points at its /platform/ endpoint, so
    # without it every turn of an autonomous agent with an identity fails to list its built-in server
    - name: Start dev MCP server
      run: mkdir -p dev/logs && (npm run dev-mcp > dev/logs/dev-mcp.log 2>&1 &)

    - name: Wait for dev MCP server
      run: |
        port=$(( $(grep '^NGINX_PORT=' .env | cut -d= -f2) + 31 ))
        for i in $(seq 30); do
          curl -s -o /dev/null "http://localhost:$port/mcp" && exit 0
          sleep 1
        done
        echo "dev MCP server did not answer on port $port"
        cat dev/logs/dev-mcp.log || true
        exit 1

    - name: Install Playwright browser
      run: npx playwright install --with-deps chromium

    - name: Run unit tests
      run: npm run test-unit

    - name: Run API tests
      run: npm run test-api