services:

  #####
  # reverse proxy for the whole environment
  #####

  nginx:
    image: nginx:1.29.4-alpine
    network_mode: host
    environment:
      - NGINX_PORT=${NGINX_PORT}
      - DEV_API_PORT=${DEV_API_PORT}
      - DEV_UI_PORT=${DEV_UI_PORT}
      - SD_PORT=${SD_PORT}
      - EVENTS_PORT=${EVENTS_PORT}
    volumes:
      - ./dev/resources/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  #####
  # related services from the data-fair stack
  #####

  simple-directory:
    # master (>= 8.24): the prefixed test API (POST /api/test-env/seed, DELETE /api/test-env?prefix=) the
    # tests seed their accounts with — `docker compose pull simple-directory` if older
    image: ghcr.io/data-fair/simple-directory:master
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=${SD_PORT}
      - PUBLIC_URL=http://localhost:${NGINX_PORT}/simple-directory
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/simple-directory
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev
      # accounts in mongo: the test suite seeds and cleans its own sub-space (test_agents_,
      # tests/support/sd-fixtures.ts) through the test API
      - STORAGE_TYPE=mongo
      - ENABLE_TEST_API=1
      # the test API needs NODE_ENV=development, the configuration stays the image's production one
      - NODE_ENV=development
      - NODE_CONFIG_ENV=production
      - ADMINS=["test_agents_superadmin@test.com"]
      - CONTACT=contact@test.com
      # tests log in through the API many times per minute
      - AUTHRATELIMIT_ATTEMPTS=500
      - AUTHRATELIMIT_DURATION=30
      - MANAGE_SITES=true
      - SECRET_SITES=secret-sites
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails
      # no mail server here (agents' notifications go through events, which tests the mail delivery): port 1
      # refuses the connection, where sd's default SMTP localhost:1025 would reach another env's maildev.
      # Not jsonTransport: it has no verify, and sd waits for its verify at startup
      - MAILS_TRANSPORT={"host":"localhost","port":1,"ignoreTLS":true}
      - MANAGE_NHIS=true
      # dev only: the issuer is http://localhost, which assertSafeIssuer would reject
      # for being non-https on a private host
      - NHIS_ALLOW_INSECURE_ISSUERS=true
      # the token endpoint an autonomous agent's bearer comes from (/api/oauth/token): off by default
      - OAUTH_SERVER_ENABLED=true
      - ANONYMOUS_CONTACT_FORM=true
      - ANONYMOUS_ACTION_NOT_BEFORE=0s
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${SD_PORT}"]
      interval: 2s
      timeout: 2s
      retries: 60

  # optional (npm run dev -- --profile events): without it the API runs with privateEventsUrl unset
  # (EVENTS_PORT blanked by dev/run.sh), and the task notification specs skip
  events:
    profiles:
      - events
    image: ghcr.io/data-fair/events:main
    network_mode: host
    depends_on:
      - mongo
    environment:
      - PORT=${EVENTS_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-events
      - OBSERVER_ACTIVE=false
      - SECRET_IDENTITIES=secret-identities
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails

  #####
  # storage
  #####

  mongo:
    # production version; later 8.0 patches refuse Ubuntu 7.0 kernels (https://jira.mongodb.org/browse/SERVER-136848)
    image: mongo:8.0.17
    ports:
      - ${MONGO_PORT}:27017
    # wiredTiger takes half the machine's RAM by default
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      # 2 s probes while starting, then one per minute: a mongosh probe costs ~1.3 s of CPU
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s

volumes:
  mongo-data:
