services:

  #####
  # reverse proxy for the whole environment
  #####

  nginx:
    image: nginx:1.29.4-alpine
    network_mode: host
    environment:
      - NGINX_PORT=${NGINX_PORT}
      - DEV_API_PORT=${DEV_API_PORT}
      - DEV_UI_PORT=${DEV_UI_PORT}
      - SD_PORT=${SD_PORT}
      - EVENTS_PORT=${EVENTS_PORT}
    volumes:
      - ./dev/resources/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro

  #####
  # related services from the data-fair stack
  #####

  simple-directory:
    # Needs the readonly guard on the NHI exchange's updateLogged call (merged upstream): without it
    # FileStorage's SYNCHRONOUS throw propagates as a 500 and an NHI can never obtain a session under
    # file storage, which is what the autonomous-agent fixture NHIs need. If the two exchange tests in
    # tests/features/autonomous-agents/nhi-exchange.api.spec.ts start failing with a 500 from the token
    # exchange, this image predates that fix — `docker compose pull simple-directory`.
    image: ghcr.io/data-fair/simple-directory:master
    network_mode: host
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - PORT=${SD_PORT}
      - PUBLIC_URL=http://localhost:${NGINX_PORT}/simple-directory
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/simple-directory
      - OBSERVER_ACTIVE=false
      - CIPHER_PASSWORD=dev
      - STORAGE_TYPE=file
      - ADMINS=["superadmin@test.com","alban.mouton@koumoul.com"]
      - CONTACT=contact@test.com
      # tests log in through the API many times per minute
      - AUTHRATELIMIT_ATTEMPTS=500
      - AUTHRATELIMIT_DURATION=30
      - MANAGE_SITES=true
      - SECRET_SITES=secret-sites
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails
      # host network: sd's default SMTP localhost:1025 would reach another env's maildev; nothing listens
      # on this one (agents' notifications go through events, which tests the mail delivery)
      - MAILS_TRANSPORT={"host":"localhost","port":${MAILDEV_SMTP_PORT},"ignoreTLS":true}
      - MANAGE_NHIS=true
      # dev only: the issuer is http://localhost, which assertSafeIssuer would reject
      # for being non-https on a private host
      - NHIS_ALLOW_INSECURE_ISSUERS=true
      # the token endpoint an autonomous agent's bearer comes from (/api/oauth/token): off by default
      - OAUTH_SERVER_ENABLED=true
      - ANONYMOUS_CONTACT_FORM=true
      - ANONYMOUS_ACTION_NOT_BEFORE=0s
    volumes:
      - ./dev/resources/users.json:/app/data/users.json
      - ./dev/resources/organizations.json:/app/data/organizations.json
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "${SD_PORT}"]
      interval: 2s
      timeout: 2s
      retries: 60

  # optional (npx --no df-dev up events): without it the API runs with privateEventsUrl unset
  # (dev/dev.json "optional"), and the task notification specs skip
  events:
    profiles:
      - events
    image: ghcr.io/data-fair/events:main
    network_mode: host
    depends_on:
      - mongo
    environment:
      - PORT=${EVENTS_PORT}
      - PRIVATE_DIRECTORY_URL=http://localhost:${SD_PORT}
      - MONGO_URL=mongodb://localhost:${MONGO_PORT}/data-fair-events
      - OBSERVER_ACTIVE=false
      - SECRET_IDENTITIES=secret-identities
      - SECRET_EVENTS=secret-events
      - SECRET_SENDMAILS=secret-sendmails

  #####
  # storage
  #####

  mongo:
    # production version; later 8.0 patches refuse Ubuntu 7.0 kernels (https://jira.mongodb.org/browse/SERVER-136848)
    image: mongo:8.0.17
    ports:
      - ${MONGO_PORT}:27017
    # wiredTiger takes half the machine's RAM by default
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      # 2 s probes while starting, then one per minute: a mongosh probe costs ~1.3 s of CPU
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 3m
      start_interval: 2s

volumes:
  mongo-data:
